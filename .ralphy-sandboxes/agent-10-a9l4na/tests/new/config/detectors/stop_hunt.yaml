name: "stop_hunt_detector"
version: "1.0.0"
description: "Detects stop hunting patterns across exchanges"

parameters:
  threshold_pct:
    default: 0.5
    min: 0.1
    max: 5.0
    description: "Price deviation threshold percentage"
    env_var: "BTQ_STOP_HUNT_THRESHOLD"
    
  min_exchanges:
    default: 3
    min: 2
    max: 10
    description: "Minimum exchanges required for detection"
    env_var: "BTQ_STOP_HUNT_MIN_EXCHANGES"
