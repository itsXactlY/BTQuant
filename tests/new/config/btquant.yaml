# BTQuant Main Configuration v2.0
version: "2.0.0"

# Shared Memory Configuration
shared_memory:
  name: "/btquant_hotspine"
  base_path: "/dev/shm"
  max_segments: 10
  buffer_size_mb: 256

# Monitoring Configuration
monitoring:
  poll_interval_ms: 100
  stats_interval_sec: 5
  market_info_interval_sec: 60
  batch_size: 100
  symbols:
    - "ALL"
    # Or strict list:
    # - "BTCUSDT"
    # - "ADAUSDT"
    # - "ZRXUSDT"
    # - "AAVEUSDT"
    # - "ACXUSDT"

# Cache Configuration
cache:
  max_trade_history: 1000
  max_orderbook_history: 500
  price_cache_max_age_sec: 5
  cleanup_interval_sec: 30

# Symbol Configuration
symbols:
  fallback_file: symbol_mapping.json
  auto_register: true
  default_quote: "USDT"

# Exchange Configuration
exchanges:
  enabled:
    - binance
    - coinbase
    - kraken
    - okx
    - bybit
    - gate
  api_timeout_ms: 5000
  retry_attempts: 3

# Detector Configuration
detectors:
  enabled:
    - stop_hunt
    - liquidity_imbalance
    - whale_frontrun
    - spread_arbitrage
    - spoofing
  parallel_execution: true
  thread_pool_size: 4

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  output: "stdout"
  file_path: "/var/log/btquant/detector.log"
  max_file_size_mb: 100
  max_backup_files: 5

# Runtime Configuration
runtime:
  max_cpu_percent: 80
  graceful_degradation: true
  metrics_endpoint: "/metrics"
