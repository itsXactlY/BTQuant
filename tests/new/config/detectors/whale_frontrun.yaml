name: "whale_frontrun_detector"
version: "1.0.0"
description: "Detects whale front-running patterns"

parameters:
  threshold_usd:
    default: 100000
    min: 10000
    max: 1000000
    description: "Minimum trade size in USD to qualify as whale"
    
  min_lagging_exchanges:
    default: 2
    min: 1
    max: 5
    description: "Minimum exchanges that must lag behind"
    
  reaction_threshold_bps:
    default: 5.0
    min: 1.0
    max: 20.0
    description: "Price movement threshold in bps"
