# BTQuant Logging Configuration
version: "1.0"

logging:
  level: "INFO"
  format:
    type: "json"
    timestamp_format: "ISO8601"
    include_location: true
    include_thread_id: true
    
  outputs:
    - type: "stdout"
      enabled: true
      colorize: true
      
    - type: "file"
      enabled: false
      path: "/var/log/btquant/detector.log"
      max_size_mb: 100
      max_backups: 5
      async: true
      
  components:
    hotspine_reader:
      level: "INFO"
    symbol_registry:
      level: "WARNING"
    detectors:
      level: "INFO"
    monitoring:
      level: "DEBUG"
      
  reload:
    enabled: true
    interval_sec: 60
